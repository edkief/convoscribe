# Tekton build config (k8s-home: tekton/pipelines/README.md). This repo
# builds no images on branch pushes. Two release tracks, each on its own tags:
# - vX.Y.Z (pushed by `release.sh prepare`) runs `release.sh publish` in the
#   Android builder image.
# - server-vX.Y.Z builds the sync server image from server/. Tekton tags it
#   git-<sha> and latest, not X.Y.Z.
version: 1
builds:
  - name: server
    context: server
    dockerfile: server/Dockerfile
    git_tags: ['^server-v[0-9]+\.[0-9]+\.[0-9]+$']
scripts:
  - name: release
    # After a toolchain or sherpa pin change, rebuild with
    # `bash scripts/build-images.sh --push builder` and update this tag to
    # `bash scripts/build-images.sh --print-builder-image`.
    image: registry.kieffer.me/convoscribe-android-builder:1.13.8-qnn2.40.0.251030-ort1.28.2-jniv1.28.0-tcc4be88e126
    command: bash scripts/release.sh publish --yes
    git_tags: ['^v[0-9]+\.[0-9]+\.[0-9]+$']
    # GH_TOKEN (fine-grained PAT, this repo, Contents: read and write) and
    # LLM_API_KEY, in namespace builds.
    secret: convoscribe-release
